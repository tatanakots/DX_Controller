name: Build Tatanako TDX IO Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yaml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

jobs:
  build-rp2350:
    name: Build Firmware for RP2350
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install APT Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential gcc-arm-none-eabi

      - name: Build RP2350 Firmware
        working-directory: firmware
        run: |
          mkdir build-rp2350
          cd build-rp2350
          cmake .. -G Ninja -DPICO_PLATFORM=rp2350 -DPICO_SDK_FETCH_FROM_GIT=on
          ninja

      - name: Upload UF2 Artifact (rp2350)
        uses: actions/upload-artifact@v4
        with:
          name: tdx_firmware_rp2350
          path: firmware/build-rp2350/src/tdx_firmware.uf2
          if-no-files-found: error

  build-rp2040:
    name: Build Firmware for RP2040
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install APT Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential gcc-arm-none-eabi

      - name: Build Pico Firmware
        working-directory: firmware
        run: |
          mkdir build-pico
          cd build-pico
          cmake .. -G Ninja -DPICO_PLATFORM=rp2040 -DPICO_SDK_FETCH_FROM_GIT=on
          ninja

      - name: Upload UF2 Artifact (pico)
        uses: actions/upload-artifact@v4
        with:
          name: tdx_firmware_rp2040
          path: firmware/build-pico/src/tdx_firmware.uf2
          if-no-files-found: error

  summarize:
    name: Summarize Artifacts
    runs-on: ubuntu-latest
    needs: [build-rp2350, build-rp2040]

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: List Downloaded Files
        run: |
          echo "Downloaded artifacts:"
          ls -R

      - name: Upload All Firmwares
        run: |
          mkdir out
          cp tdx_firmware_pico/tdx_firmware.uf2 out/tdx_firmware_rp2040.uf2
          cp tdx_firmware_rp2350/tdx_firmware.uf2 out/tdx_firmware_rp2350.uf2

      - name: Upload Combined Firmware Zip
        uses: actions/upload-artifact@v4
        with:
          name: tdx_firmware_all
          path: out/*
